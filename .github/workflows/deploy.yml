name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # environments/ é gitignored: recria a partir dos Secrets (Settings → Secrets → Actions)
      - name: Criar environment.prod.ts a partir dos Secrets
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            supabaseUrl: '${{ secrets.SUPABASE_URL }}',
            supabaseKey: '${{ secrets.SUPABASE_KEY }}',
          };
          EOF
      # Troque --base-href pelo nome do SEU repositório: /<repo>/
      - run: npx ng build --configuration production --base-href /amor-neurodivergente/
      - run: cp dist/meu-projeto-angular/browser/index.html dist/meu-projeto-angular/browser/404.html
      - run: touch dist/meu-projeto-angular/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/meu-projeto-angular/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
