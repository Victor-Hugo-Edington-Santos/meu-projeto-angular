name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular 22 exige ^22.22.3 || ^24.15.0 || >=26 (ver engines no
          # package.json). Node 20 nao e suportado por esta toolchain.
          node-version: 24
          cache: npm
      - run: npm ci
      # src/environments/* é versionado e gerado do .env (que só tem a
      # publishable key, pública por design). O hook prebuild regenera os
      # arquivos a partir do .env antes do ng build.
      # Troque --base-href pelo nome do SEU repositório: /<repo>/
      - run: npm run build -- --base-href /amor-neurodivergente/
      - run: cp dist/meu-projeto-angular/browser/index.html dist/meu-projeto-angular/browser/404.html
      - run: touch dist/meu-projeto-angular/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/meu-projeto-angular/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
