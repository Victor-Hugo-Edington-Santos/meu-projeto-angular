<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Amor NeuroDivergente</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Atkinson+Hyperlegible:wght@400;700&family=Poppins:wght@400;500;600;700&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script src="https://cdn.userway.org/widget.js"
          data-account="QQqIFghR0i"
          data-position="3"
          data-offset="20, 160"></script>

  <script>
    (function () {
      function fix() {
        const el = document.querySelector('#userwayAccessibilityIcon, .userway_buttons_wrapper');
        if (el) {
          el.style.setProperty('right', '0px', 'important');
          el.style.setProperty('bottom', '50px', 'important');
          el.style.setProperty('top', 'auto', 'important');
          el.style.setProperty('left', 'auto', 'important');
        }
      }
      const t = setInterval(fix, 300);
      setTimeout(() => clearInterval(t), 10000);
      new MutationObserver(fix).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <!-- VLibras -->
  <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
          <div class="vw-plugin-top-wrapper"></div>
      </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
</body>
</html>
